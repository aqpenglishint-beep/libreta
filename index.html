<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libreta</title>
<meta name="theme-color" content="#0a0f1c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Manrope";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-800-normal.woff2") format("woff2")}
:root{
  --bg:#0a0f1c;--card:#121a2e;--ink:#e9eefc;--muted:#8c9bbd;--line:#1e2a47;
  --accent:#3b82f6;--accent-ink:#04101f;--accent-soft:#15254a;
  --ok:#2dd4bf;--ok-ink:#04201d;--ok-soft:#0f2f33;--warn:#ffc561;--warn-soft:#352b12;--bad:#ff7d8c;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:680px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 24px max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
h2{font-size:17px;font-weight:800;margin:0}
h3{font-size:15px;font-weight:800;margin:0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.sub{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.big{font-variant-numeric:tabular-nums;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.card{background:var(--card);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.meter.acc>i{background:var(--accent)}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0;min-height:44px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.amount{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font:800 15px var(--font);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px}
.btn.x{background:transparent;color:var(--muted);padding:4px 10px;font-size:22px;line-height:1;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border-radius:14px;padding:4px}
.seg button{border:0;border-radius:10px;background:transparent;color:var(--muted);min-height:44px;font:800 14px var(--font)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:0 14px;font:600 13px var(--font)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip.on.mark{background:var(--card);border-color:var(--muted);color:var(--ink)}
.pd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--ok-soft);color:var(--ok)}.pill.mut{background:var(--line);color:var(--muted)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.it{display:flex;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.itbody{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);text-align:left;font:inherit;padding:6px 0;min-height:44px;display:grid;gap:3px;align-content:center}
.it .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.it .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.it.done .t{text-decoration:line-through;opacity:.55}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;color:var(--ok-ink);font-size:15px;font-weight:800;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.auto{opacity:.9}
.hit{width:44px;height:44px;flex:none;background:transparent;border:0;display:grid;place-items:center;padding:0;margin:-8px -8px -8px -8px}
.hit.static{pointer-events:none}
.tcol{flex:none;width:74px;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:800;padding:12px 0 2px}
.hdots{display:flex;flex-wrap:wrap;gap:2px}
.hdots i{width:8px;height:8px;border-radius:2px;border:1px solid var(--muted);box-sizing:border-box}
.hdots i.on{background:var(--ok);border-color:var(--ok)}
.hdots i.fut{border-color:var(--line)}
.cnt{font-weight:800;font-size:14px;color:var(--ok);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:800;padding-bottom:2px}
.cal button{min-height:52px;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--ink);font:800 14px var(--font);display:grid;place-items:center;align-content:center;gap:5px;padding:0}
.cal button .mk{display:flex;gap:3px;height:6px}
.cal button .mk i{width:6px;height:6px;border-radius:50%}
.cal button.hoy{border-color:var(--muted)}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal.week button{min-height:64px}
.cal button.otro{visibility:hidden}
.mg{display:flex;flex-wrap:wrap;gap:4px}
.mg button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 12px var(--font);padding:0}
.mg button.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.mg button.hoy{outline:2px solid var(--accent);outline-offset:1px}
.mg button.fut{opacity:.35}
.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.inner{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:10px}
details summary{cursor:pointer;color:var(--accent);font-weight:800;font-size:14px;min-height:36px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:10px max(4px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px));z-index:10}
nav.tabs button{background:transparent;border:0;color:var(--muted);font:700 11px var(--font);display:grid;justify-items:center;gap:4px;padding:2px 0;min-height:48px;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
nav.tabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--warn);color:#1a1200;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
.gear{background:transparent;border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:44px;color:var(--ink);font:700 14px var(--font)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ok);color:var(--ok-ink);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:680px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.paso{display:flex;gap:10px;align-items:center;font-size:14px}
.paso .check{width:24px;height:24px;font-size:13px}
.warnmsg{font-size:13px;color:var(--warn);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= Constantes ================= */
const KEY="libreta-v1"; // misma llave de siempre: así no se pierden tus datos
const METODOS=["Efectivo","Yape","Tarjeta"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const DIAS_L=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const PROJ=[{k:"ucsm",n:"UCSM",c:"#6aa9ff"},{k:"aqp",n:"AQP",c:"#ffb84d"},{k:"grav",n:"Gravity",c:"#b48cff"},{k:"can",n:"Canchas",c:"#5fd0c8"},{k:"sar",n:"Sarah Wellness",c:"#ff8fb1"},{k:"deu",n:"Deudas",c:"#ff9f7a"},{k:"per",n:"Personal",c:"#c9ced6"}];
const PN={};PROJ.forEach(p=>{PN[p.k]=p;});
const TIPOS=["Tarea","Evento","Clase","Pago"];
const REPS=["No","Cada día","Cada semana"];
const REMS=["Sin aviso","10 min antes","1 hora antes","1 día antes"];
const REM_ICS={"10 min antes":"-PT10M","1 hora antes":"-PT1H","1 día antes":"-P1D"};
const HAB_BASE=[{n:"Leer 10 minutos",de:"Leer 20 min"},{n:"Ir al gimnasio",de:"Gimnasio"},{n:"Alimentarse bien"},{n:"Terminar toda la agenda",auto:true},{n:"Celular menos de 7 horas"}];

/* ================= Utils ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoy=()=>isoOf(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoOf(d);};
const diasHasta=iso=>Math.round((new Date(iso+"T12:00:00")-new Date(hoy()+"T12:00:00"))/864e5);
const corta=iso=>{const [y,m,d]=iso.split("-");return (+d)+" "+MESES[+m-1].slice(0,3);};
const cap=t=>t?t[0].toUpperCase()+t.slice(1):t;
const larga=iso=>{const d=new Date(iso+"T12:00:00");return DIAS_L[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()];};
const mesNombre=k=>{const [y,m]=k.split("-");return MESES[+m-1]+" "+y;};
const diasDelMes=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate();};
const fmt=n=>"S/ "+(Math.round((+n||0)*100)/100).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0;};
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}
function cuando(dd){return dd<0?`venció hace ${-dd} día${dd===-1?"":"s"}`:dd===0?"vence hoy":dd===1?"vence mañana":`vence en ${dd} días`;}
function enDias(dd){return dd<0?`Venció hace ${-dd} d`:dd===0?"Hoy":dd===1?"Mañana":`En ${dd} días`;}
function pillDias(dd){return dd<0?`<span class="pill warn">Vencida</span>`:dd===0?`<span class="pill warn">Hoy</span>`:dd<=3?`<span class="pill warn">${dd===1?"Mañana":dd+" d"}</span>`:`<span class="pill mut">${dd} días</span>`;}
function saludo(){const h=new Date().getHours();return h<12?"Buen día":h<19?"Buenas tardes":"Buenas noches";}

/* ================= Datos ================= */
function habitosBase(){return HAB_BASE.map(b=>({id:"hb-"+uid(),nombre:b.n,dias:{},auto:!!b.auto,activo:true}));}
function seed(){
  return {version:3,
    fin:{ingresos:[],fijos:[],deudas:[],meta:1000,tope:10,movs:[],saldos:{Efectivo:0,Yape:0,Tarjeta:0},saldosListos:false,cobros:[]},
    items:[],habitos:habitosBase(),notas:[]};
}
function proyDe(t){t=(t||"").toLowerCase();
  if(/cancha/.test(t))return "can";if(/sarah/.test(t))return "sar";if(/aqp/.test(t))return "aqp";
  if(/gdi|expo|ponencia|ucsm|curso|examen/.test(t))return "ucsm";if(/gravity/.test(t))return "grav";return "per";}
// Pasa los datos de versiones anteriores al formato v3 sin perder nada
function migrar(s){
  if(!s||!s.fin)return seed();
  s.version=s.version||1;
  if(s.version<2){
    s.fin.saldos=s.fin.saldos||{Efectivo:0,Yape:0,Tarjeta:0};s.fin.saldosListos=false;
    (s.fin.movs||[]).forEach(m=>{m.legacy=true;});
    (s.fin.deudas||[]).forEach(d=>{
      d.abonos=d.abonos||[];
      if(d.pagado&&!d.abonos.length){const m=(s.fin.movs||[]).find(x=>x.id===d.movId);
        d.abonos.push({id:"a"+d.id,monto:+d.monto||0,fecha:m?m.fecha:hoy(),movId:d.movId||null});
        if(m){m.deudaId=d.id;m.abonoId="a"+d.id;}}
      delete d.pagado;delete d.movId;});
    s.version=2;
  }
  if(s.version<3){
    s.items=(s.tareas||[]).map(t=>({id:t.id,texto:t.texto,tipo:"Tarea",proy:proyDe(t.texto),fecha:t.fecha||"",todoDia:!t.hora,hora:t.hora||"",fin:"",
      hecha:!!t.hecha,hechaEl:t.hechaEl||null,rep:"No",rem:"Sin aviso",pri:"Normal",notas:"",pasos:[],serie:null,creada:t.creada||Date.now()}));
    const viejos=s.habitos||[],usados=new Set();
    const nuevos=HAB_BASE.map(b=>{const v=b.de&&viejos.find(x=>x.nombre===b.de);if(v)usados.add(v.id);
      return {id:v?v.id:"hb-"+uid(),nombre:b.n,dias:v?v.dias:{},auto:!!b.auto,activo:true};});
    viejos.forEach(v=>{if(!usados.has(v.id))nuevos.push({id:v.id,nombre:v.nombre,dias:v.dias||{},auto:false,activo:false});});
    s.habitos=nuevos;delete s.tareas;s.version=3;
  }
  s.fin.cobros=s.fin.cobros||[];s.fin.movs=s.fin.movs||[];s.fin.deudas=s.fin.deudas||[];
  s.items=s.items||[];s.habitos=s.habitos||[];s.notas=s.notas||[];
  return s;
}
let S;
try{const raw=localStorage.getItem(KEY);S=JSON.parse(raw);
  // copia de seguridad automática de tus datos de antes, por si acaso
  if(S&&S.version&&S.version<3&&!localStorage.getItem(KEY+"-pre-v3"))localStorage.setItem(KEY+"-pre-v3",raw);}catch(e){S=null;}
S=S&&S.version?migrar(S):seed();
function save(){syncAgenda();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("No se pudo guardar en el celular");}updateBadge();}

/* ================= Pagos (deudas, cobros, movimientos) ================= */
const pagado=d=>d.abonos.reduce((s,a)=>s+num(a.monto),0);
const resta=d=>r2(Math.max(0,num(d.monto)-pagado(d)));
const deudasPend=()=>S.fin.deudas.filter(d=>resta(d)>0).sort((a,b)=>a.vence.localeCompare(b.vence));
const totalDeuda=()=>deudasPend().reduce((s,d)=>s+resta(d),0);
const fondo=()=>S.fin.movs.filter(m=>m.tipo==="ahorro").reduce((s,m)=>s+num(m.monto),0);
function agregarMov(m){m.id=m.id||uid();m.ts=m.ts||Date.now().toString(36);S.fin.movs.push(m);return m;}
function borrarMov(id){
  const m=S.fin.movs.find(x=>x.id===id);if(!m)return;
  S.fin.movs=S.fin.movs.filter(x=>x.id!==id);
  if(m.deudaId){const d=S.fin.deudas.find(x=>x.id===m.deudaId);if(d)d.abonos=d.abonos.filter(a=>a.movId!==id);}
  if(m.cobroId){const c=S.fin.cobros.find(x=>x.id===m.cobroId);if(c){c.cobrado=false;c.movId=null;}}
}

/* ================= Agenda (tareas y eventos) ================= */
const cmpHora=(a,b)=>((a.todoDia?"":a.hora||"")+"|"+a.texto).localeCompare((b.todoDia?"":b.hora||"")+"|"+b.texto);
function pagosDe(iso){return deudasPend().filter(d=>d.vence===iso).map(d=>({virtual:true,id:"deu-"+d.id,texto:"Vence "+d.a+" · "+fmt(resta(d)),proy:"deu",tipo:"Pago",todoDia:true,hora:"",fecha:iso}));}
function itemsDia(iso,hid){
  const reales=S.items.filter(i=>i.fecha===iso&&!(hid&&hid[i.proy])).sort(cmpHora);
  return (hid&&hid.deu?[]:pagosDe(iso)).concat(reales);
}
// Lo que toca hoy: lo atrasado que sigue pendiente + lo de hoy
function hoyLista(){
  const h=hoy();
  const atr=S.items.filter(i=>i.fecha&&i.fecha<h&&(!i.hecha||i.hechaEl===h)).sort((a,b)=>a.fecha.localeCompare(b.fecha)||cmpHora(a,b));
  const hh=S.items.filter(i=>i.fecha===h).sort(cmpHora);
  return atr.concat(hh);
}
function agendaCompleta(){const l=hoyLista();return l.length>0&&l.every(i=>i.hecha);}
function syncAgenda(){const h=S.habitos.find(x=>x.auto&&x.activo!==false);if(!h)return;if(agendaCompleta())h.dias[hoy()]=true;else delete h.dias[hoy()];}
function updateBadge(){
  const n=hoyLista().filter(i=>!i.hecha).length+deudasPend().filter(d=>diasHasta(d.vence)<=3).length;
  try{if("setAppBadge" in navigator){n?navigator.setAppBadge(n).catch(()=>{}):navigator.clearAppBadge().catch(()=>{});}}catch(e){}
}
function tiempo(i){return i.todoDia?"Todo el día":(i.hora||"")+(i.fin?"–"+i.fin:"");}
function extras(i){
  const a=[i.tipo];if(i.rep&&i.rep!=="No")a.push(i.rep);if(i.pri==="Alta")a.push("Prioridad alta");
  if(i.pasos&&i.pasos.length)a.push(i.pasos.filter(p=>p.ok).length+"/"+i.pasos.length+" pasos");return a;
}

/* ================= Hábitos ================= */
const contarMes=(h,k)=>Object.keys(h.dias).filter(d=>d.slice(0,7)===k&&h.dias[d]).length;
function racha(h){let n=0,d=hoy();if(!h.dias[d])d=addDays(d,-1);while(h.dias[d]){n++;d=addDays(d,-1);}return n;}
const habActivos=()=>S.habitos.filter(h=>h.activo!==false);

/* ================= Calendario del iPhone (.ics) ================= */
function descargar(nombre,txt){
  const url=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));
  const a=document.createElement("a");a.href=url;a.download=nombre+".ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function icsEsc(t){return String(t).replace(/[\\,;]/g,"\\$&").replace(/\n/g,"\\n");}
function icsEvento(nombre,titulo,fecha,hora,fin,todoDia,alarma,rep,notas){
  const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",f=fecha.replace(/-/g,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Libreta//ES","BEGIN:VEVENT","UID:"+uid()+"@libreta","DTSTAMP:"+now];
  if(todoDia){L.push("DTSTART;VALUE=DATE:"+f,"DTEND;VALUE=DATE:"+addDays(fecha,1).replace(/-/g,""));}
  else{L.push("DTSTART:"+f+"T"+(hora||"09:00").replace(":","")+"00");L.push(fin?"DTEND:"+f+"T"+fin.replace(":","")+"00":"DURATION:PT30M");}
  L.push("SUMMARY:"+icsEsc(titulo));
  if(notas)L.push("DESCRIPTION:"+icsEsc(notas));
  if(rep==="Cada día")L.push("RRULE:FREQ=DAILY;COUNT=30");else if(rep==="Cada semana")L.push("RRULE:FREQ=WEEKLY;COUNT=12");
  if(alarma)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(titulo),"TRIGGER:"+alarma,"END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");descargar(nombre,L.join("\r\n"));
}

/* ---------- piezas comunes ---------- */
function filaItem(i,o){
  o=o||{};const p=PN[i.proy]||PN.per;
  if(i.virtual)return `<div class="it"><div class="tcol">Todo el día</div><button class="itbody" data-act="tab" data-v="pagos"><span class="t">${esc(i.texto)}</span><span class="m"><i class="pd" style="background:${p.c}"></i>${p.n} · Pago</span></button></div>`;
  const atr=i.fecha&&i.fecha<hoy()&&!i.hecha;
  const meta=[`<i class="pd" style="background:${p.c}"></i>${esc(p.n)}`];
  if(o.atr&&atr)meta.push("Pendiente desde el "+corta(i.fecha));else if(o.hora!==false)meta.push(tiempo(i));
  extras(i).forEach(x=>meta.push(esc(x)));
  const tc=o.col?`<div class="tcol">${i.todoDia?"Todo el día":esc(i.hora||"")}</div>`:"";
  return `<div class="it ${i.hecha?"done":""}"><button class="hit" data-act="it-ok" data-id="${i.id}" aria-label="Marcar hecha" aria-pressed="${!!i.hecha}"><span class="check ${i.hecha?"on":""}">${i.hecha?"✓":""}</span></button>${tc}
  <button class="itbody" data-act="it-edit" data-id="${i.id}"><span class="t">${esc(i.texto)}</span><span class="m">${meta.join(" · ").replace(/ · <i/,"<i")}</span></button>
  ${atr&&o.atr?`<button class="btn ghost sm" data-act="it-hoy" data-id="${i.id}">Pasar a hoy</button>`:""}</div>`;
}
function dotsDe(iso){
  const l=itemsDia(iso,hid),pend=l.filter(i=>!i.hecha);
  if(pend.length)return pend.slice(0,3).map(i=>`<i style="background:${(PN[i.proy]||PN.per).c}"></i>`).join("");
  return l.length?`<i style="background:var(--ok)"></i>`:"";
}
function habFila(x){
  const k=hoy().slice(0,7),n=diasDelMes(k),t=hoy();let dots="";
  for(let d=1;d<=n;d++){const iso=k+"-"+pad(d);dots+=`<i class="${x.dias[iso]?"on":iso>t?"fut":""}"></i>`;}
  const on=!!x.dias[t];
  const chk=x.auto?`<span class="hit static"><span class="check auto ${on?"on":""}">${on?"✓":""}</span></span>`
    :`<button class="hit" data-act="hab-tog" data-id="${x.id}" data-dia="${t}" aria-pressed="${on}" aria-label="${esc(x.nombre)}"><span class="check ${on?"on":""}">${on?"✓":""}</span></button>`;
  return `<div style="border-top:1px solid var(--line);padding-top:6px;display:grid;gap:6px"><div class="row" style="flex-wrap:nowrap;gap:12px">${chk}
    <div class="grow"><div style="font-weight:600;font-size:15px">${esc(x.nombre)}</div>${x.auto?`<div class="sub">Se marca sola al terminar Para hoy</div>`:""}</div><span class="cnt">${contarMes(x,k)}/${n}</span></div>
    <div class="hdots" aria-hidden="true">${dots}</div></div>`;
}

function vCal(){
  const h=hoy(),[y,m]=calMes.split("-").map(Number);
  const chips=`<div class="chips scroll"><button class="chip ${Object.keys(hid).some(k=>hid[k])?"":"on mark"}" data-act="cal-filtro" data-v="">Todo</button>${PROJ.map(p=>`<button class="chip ${hid[p.k]?"":"on mark"}" data-act="cal-filtro" data-v="${p.k}"><i class="pd" style="background:${p.c}"></i>${p.n}</button>`).join("")}</div>`;
  let vista="";
  if(calVista==="mes"){
    const off=(new Date(y,m-1,1).getDay()+6)%7,nd=diasDelMes(calMes);let celdas="";
    for(let i=0;i<off;i++)celdas+=`<button class="otro" tabindex="-1" aria-hidden="true"></button>`;
    for(let d=1;d<=nd;d++){const iso=calMes+"-"+pad(d);
      celdas+=`<button class="${iso===h?"hoy":""} ${iso===calDia?"sel":""}" data-act="cal-dia" data-v="${iso}" aria-label="${larga(iso)}">${d}<span class="mk">${dotsDe(iso)}</span></button>`;}
    vista=`<section class="card"><div class="row between"><button class="btn ghost sm" data-act="cal-mes" data-v="-1" aria-label="Mes anterior">‹</button><h2 style="text-transform:capitalize">${mesNombre(calMes)}</h2><button class="btn ghost sm" data-act="cal-mes" data-v="1" aria-label="Mes siguiente">›</button></div>
      <div class="cal">${["L","M","X","J","V","S","D"].map(x=>`<span class="wd">${x}</span>`).join("")}${celdas}</div></section>`;
  }else if(calVista==="semana"){
    const dd=new Date(calDia+"T12:00:00"),ini=addDays(calDia,-((dd.getDay()+6)%7));
    const dias=[...Array(7)].map((_,i)=>addDays(ini,i));
    vista=`<section class="card"><div class="row between"><button class="btn ghost sm" data-act="cal-sem" data-v="-7" aria-label="Semana anterior">‹</button><h2>${corta(dias[0])} – ${corta(dias[6])}</h2><button class="btn ghost sm" data-act="cal-sem" data-v="7" aria-label="Semana siguiente">›</button></div>
      <div class="cal week">${dias.map(iso=>`<button class="${iso===h?"hoy":""} ${iso===calDia?"sel":""}" data-act="cal-dia" data-v="${iso}" aria-label="${larga(iso)}"><span style="font-size:11px;opacity:.8">${DIAS[new Date(iso+"T12:00:00").getDay()].toUpperCase()}</span>${+iso.slice(8)}<span class="mk">${dotsDe(iso)}</span></button>`).join("")}</div></section>`;
  }
  let cuerpo="";
  if(calVista!=="lista"){
    const l=itemsDia(calDia,hid);
    cuerpo=`<section class="card"><div class="row between"><h2>${calDia===h?"Hoy":calDia===addDays(h,1)?"Mañana":cap(larga(calDia))}</h2><span class="sub">${l.length===1?"1 evento":l.length+" eventos"}</span></div>
      <div class="list">${l.map(i=>filaItem(i,{col:true,hora:false})).join("")||`<div class="empty">Nada para este día.</div>`}</div>
      <button class="btn ghost" data-act="it-nuevo" style="border-style:dashed">+ Agregar algo a este día</button></section>
    <section class="card"><h3>Llévalo a tu calendario</h3><div class="sub">Abre un evento y toca "Agregar a mi calendario": se guarda en el Calendario del iPhone con su aviso.</div></section>`;
  }else{
    let g="";const atr=hoyLista().filter(i=>i.fecha<h&&!i.hecha);
    if(atr.length)g+=`<div class="dayhead"><span>Pendientes de antes</span></div>`+atr.map(i=>filaItem(i,{atr:true})).join("");
    for(let k=0;k<=30;k++){const iso=addDays(h,k),l=itemsDia(iso,hid);if(!l.length)continue;
      g+=`<div class="dayhead"><span>${k===0?"Hoy":k===1?"Mañana":cap(larga(iso))}</span></div>`+l.map(i=>filaItem(i,{col:true,hora:false})).join("");}
    const sf=S.items.filter(i=>!i.fecha&&!i.hecha);
    if(sf.length)g+=`<div class="dayhead"><span>Sin fecha</span></div>`+sf.map(i=>filaItem(i,{})).join("");
    cuerpo=`<section class="card"><div class="list">${g||`<div class="empty">No hay nada en los próximos 30 días.</div>`}</div></section>`;
  }
  const irHoy=(calDia!==h||calMes!==h.slice(0,7))&&calVista!=="lista"?`<button class="btn ghost sm" data-act="cal-hoy" style="justify-self:center">Ir a hoy</button>`:"";
  return `<header class="top"><div><div class="lbl">${mesNombre(calMes)}</div><h1>Calendario</h1></div><div class="row"><button class="btn" data-act="it-nuevo">+ Nuevo</button><button class="gear" data-act="ajustes">Ajustes</button></div></header>
  <div class="seg">${[["mes","Mes"],["semana","Semana"],["lista","Lista"]].map(([k,l])=>`<button class="${calVista===k?"on":""}" data-act="cal-vista" data-v="${k}">${l}</button>`).join("")}</div>
  ${chips}${vista}${irHoy}${cuerpo}`;
}

function cardDeuda(d){

  if(editDeuda===d.id)return `<section class="card"><h3>Editar deuda</h3><form data-form="deuda-edit" data-id="${d.id}" style="display:grid;gap:8px">
    <label class="sub">¿A quién?<input name="a" value="${esc(d.a)}" required></label>
    <div class="g2"><label class="sub">Monto total (S/)<input name="monto" inputmode="decimal" value="${d.monto}" required></label><label class="sub">Vence<input name="vence" type="date" value="${d.vence}" required></label></div>
    <label class="sub">Nota<input name="nota" value="${esc(d.nota||"")}"></label>
    <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-act="deu-cancel">Cancelar</button><button class="btn danger" type="button" data-act="deu-del" data-id="${d.id}">Eliminar</button></div></form></section>`;
  return `<section class="card"><div class="row between"><div class="grow"><h2>${esc(d.a)}</h2><div class="sub">Vence ${DIAS[new Date(d.vence+"T12:00:00").getDay()]} ${corta(d.vence)}${d.nota?" · "+esc(d.nota):""}</div></div>${r>0?pillDias(dd):`<span class="pill good">Pagada</span>`}</div>
    <div class="row between"><div><div class="lbl">${r>0?"Te falta":"Total"}</div><div class="big">${fmt(r>0?r:d.monto)}</div></div>${pg>0&&r>0?`<div class="sub" style="text-align:right">Pagaste ${fmt(pg)}<br>de ${fmt(d.monto)}</div>`:""}</div>
    ${pg>0&&r>0?`<div class="meter"><i style="width:${p}%"></i></div>`:""}
    <div class="row">${r>0?`<button class="btn" data-act="pagar" data-id="${d.id}">Pagar</button>`:""}<button class="btn ghost" data-act="deu-edit" data-id="${d.id}">Editar</button>${r>0?`<button class="btn ghost" data-act="deu-cal" data-id="${d.id}">Aviso</button>`:""}</div>
    ${d.abonos.length?`<details><summary>Pagos hechos (${d.abonos.length})</summary><div class="list">${d.abonos.map(a=>`<div class="it"><div class="grow"><div class="t num">${fmt(a.monto)}</div><div class="m">${corta(a.fecha)}${a.metodo?" · con "+esc(a.metodo):""}</div></div><button class="btn ghost sm" data-act="abono-del" data-deuda="${d.id}" data-id="${a.id}">Deshacer</button></div>`).join("")}</div></details>`:""}</section>`;
}

function pHistorial(){
  const k=hoy().slice(0,7),keys=[...new Set([k,...S.fin.movs.map(m=>m.fecha.slice(0,7))])].sort().reverse();
  if(!mesSel||!keys.includes(mesSel))mesSel=k;
  const movs=S.fin.movs.filter(m=>m.fecha.slice(0,7)===mesSel).sort((a,b)=>(b.fecha+b.ts).localeCompare(a.fecha+a.ts));
  const tot=t=>movs.filter(m=>m.tipo===t).reduce((s,m)=>s+num(m.monto),0);
  const porDia={};movs.forEach(m=>(porDia[m.fecha]=porDia[m.fecha]||[]).push(m));
  const lista=Object.keys(porDia).sort().reverse().map(d=>`<div class="dayhead"><span>${cap(larga(d))}</span></div>`+porDia[d].map(m=>{
    const entra=m.tipo==="ingreso"||m.tipo==="ahorro",et=m.tipo==="ahorro"?"Ahorro":m.cat;
    const sub=[m.metodo?"con "+m.metodo:"",m.nota||""].filter(Boolean).join(" · ");
    return `<div class="it"><div class="grow"><div class="t">${esc(et)}</div><div class="m">${esc(sub)}</div></div><span class="num" style="font-weight:800;color:${entra?"var(--ok)":"var(--ink)"}">${entra?"+":"−"} ${fmt(m.monto)}</span><button class="btn x" data-act="mov-del" data-id="${m.id}" aria-label="Borrar">×</button></div>`;}).join("")).join("");
  return `<section class="card"><div class="row between"><h2>Resumen</h2><select data-act="mes-sel" style="width:auto" aria-label="Mes">${keys.map(x=>`<option value="${x}" ${x===mesSel?"selected":""}>${mesNombre(x)}</option>`).join("")}</select></div>

/* ================= HÁBITOS ================= */

  const card=x=>{let g="";for(let d=1;d<=n;d++){const iso=k+"-"+pad(d),on=!!x.dias[iso],fut=iso>t;
      g+=`<button class="${on?"on":""} ${iso===t?"hoy":""} ${fut?"fut":""}" ${fut||x.auto?"disabled":""} data-act="hab-tog" data-id="${x.id}" data-dia="${iso}" aria-label="${x.nombre} ${corta(iso)}" aria-pressed="${on}">${d}</button>`;}
    const r=racha(x);
    return `<section class="card"><div class="row between"><h2>${esc(x.nombre)}</h2><span class="cnt">${contarMes(x,k)}/${n}</span></div>
      <div class="row"><span class="pill ${r?"good":"mut"}">${r} día${r===1?"":"s"} seguidos</span>${x.auto?`<span class="sub">Se marca sola</span>`:""}</div>

  `<section class="card"><div class="row between"><button class="btn ghost sm" data-act="hab-mes" data-v="-1" aria-label="Mes anterior">‹</button><h2 style="text-transform:capitalize">${mesNombre(k)}</h2><button class="btn ghost sm" data-act="hab-mes" data-v="1" aria-label="Mes siguiente" ${actual?"disabled":""}>›</button></div>

  `<section class="card"><h2>Nuevo hábito</h2><form data-form="habito" class="row" style="flex-wrap:nowrap" autocomplete="off"><input name="nombre" placeholder="Ej: Leer 10 minutos" required><button class="btn" type="submit">Agregar</button></form></section>`+
  (arch.length?`<section class="card"><details><summary>Archivados (${arch.length})</summary><div class="list">${arch.map(x=>`<div class="it"><div class="grow"><div class="t">${esc(x.nombre)}</div><div class="m">${Object.keys(x.dias).length} días guardados</div></div><button class="btn ghost sm" data-act="hab-on" data-id="${x.id}">Reactivar</button><button class="btn x" data-act="hab-del" data-id="${x.id}" aria-label="Borrar">×</button></div>`).join("")}</div></details></section>`:"");
}

  return {id:null,texto:"",tipo:"Tarea",proy:"per",fecha:fecha,todoDia:false,hora:"09:00",fin:"10:00",rep:"No",rem:"Sin aviso",pri:"Normal",notas:"",pasos:[],pasoIn:"",err:false};
}
function chipsFM(k,vals,dots){return `<div class="chips">${vals.map(v=>{const val=typeof v==="object"?v.k:v,lab=typeof v==="object"?v.n:v;

  <div class="lbl">Horario</div><div class="chips"><button type="button" class="chip ${f.todoDia?"":"on"}" data-act="fm-set" data-k="todoDia" data-v="0">Con hora</button><button type="button" class="chip ${f.todoDia?"on":""}" data-act="fm-set" data-k="todoDia" data-v="1">Todo el día</button></div>
  <label class="lbl" for="fm-fecha">Fecha</label><input id="fm-fecha" type="date" data-fm="fecha" value="${f.fecha}">
  ${f.todoDia?"":`<div class="g2"><div><label class="lbl" for="fm-hora">Desde</label><input id="fm-hora" type="time" data-fm="hora" value="${f.hora}"></div><div><label class="lbl" for="fm-fin">Hasta</label><input id="fm-fin" type="time" data-fm="fin" value="${f.fin}"></div></div>`}
  ${edit?"":`<div class="lbl">Repetir</div>${chipsFM("rep",REPS)}`}
  <div class="lbl">Avisarme</div>${chipsFM("rem",REMS)}
  <div class="lbl">Prioridad</div>${chipsFM("pri",["Normal","Alta"])}
  <div class="lbl">Pasos (opcional)</div>
  ${f.pasos.map((p,i)=>`<div class="paso"><button type="button" class="check ${p.ok?"on":""}" data-act="fm-paso-ok" data-i="${i}" aria-label="Paso hecho">${p.ok?"✓":""}</button><span class="grow">${esc(p.t)}</span><button type="button" class="btn x" data-act="fm-paso-del" data-i="${i}" aria-label="Quitar paso">×</button></div>`).join("")}
  <div class="row" style="flex-wrap:nowrap"><input data-fm="pasoIn" value="${esc(f.pasoIn)}" placeholder="Ej: Buscar la fuente" autocomplete="off" aria-label="Agregar un paso"><button type="button" class="btn ghost" data-act="fm-paso-add" aria-label="Agregar paso">+</button></div>
  <label class="lbl" for="fm-notas">Notas</label><textarea id="fm-notas" data-fm="notas" rows="2" placeholder="Links, detalles, lo que necesites recordar">${esc(f.notas)}</textarea>

/* ================= Eventos ================= */
function crearItems(f){
  const base={texto:f.texto.trim(),tipo:f.tipo,proy:f.proy,todoDia:!!f.todoDia,hora:f.todoDia?"":(f.hora||"09:00"),fin:f.todoDia?"":(f.fin||""),rep:f.rep,rem:f.rem,pri:f.pri,notas:f.notas||"",hecha:false,hechaEl:null,creada:Date.now()};
  const paso=f.rep==="Cada día"?1:f.rep==="Cada semana"?7:0,n=paso===1?30:paso===7?12:1,serie=paso?uid():null;
  for(let k=0;k<n;k++)S.items.push(Object.assign({},base,{id:uid(),fecha:addDays(f.fecha,k*(paso||0)),serie:serie,pasos:f.pasos.map(p=>({t:p.t,ok:false}))}));
}
function abrirForm(fecha,it){FM=nuevoFM(fecha,it);sheet="form";renderSheet();}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  const I=()=>S.items.find(x=>x.id===id),D=()=>S.fin.deudas.find(x=>x.id===id);
  switch(a){
    case "tab":go(v);break;
    case "ajustes":ajustes=true;sheet=null;render();window.scrollTo(0,0);break;
    case "cerrar":ajustes=false;render();break;
    case "sheet-close":sheet=null;renderSheet();break;
    // agenda
    case "it-ok":{const i=I();if(!i)break;i.hecha=!i.hecha;i.hechaEl=i.hecha?hoy():null;save();render();break;}
    case "it-hoy":{const i=I();if(i){i.fecha=hoy();save();render();toast("Pasada a hoy");}break;}
    case "it-edit":{const i=I();if(i)abrirForm(i.fecha,i);break;}
    case "it-nuevo":abrirForm(tab==="cal"?calDia:hoy());break;
    case "fm-set":FM[b.dataset.k]=b.dataset.k==="todoDia"?v==="1":v;renderSheet();break;
    case "fm-paso-add":{if(FM.pasoIn.trim()){FM.pasos.push({t:FM.pasoIn.trim(),ok:false});FM.pasoIn="";renderSheet();}break;}
    case "fm-paso-del":FM.pasos.splice(+b.dataset.i,1);renderSheet();break;
    case "fm-paso-ok":{const p=FM.pasos[+b.dataset.i];if(p){p.ok=!p.ok;renderSheet();}break;}
    case "fm-save":{
      if(!FM.texto.trim()){FM.err=true;renderSheet();break;}
      if(!FM.fecha)FM.fecha=hoy();
      if(FM.pasoIn.trim()){FM.pasos.push({t:FM.pasoIn.trim(),ok:false});FM.pasoIn="";}
      if(FM.id){const i=S.items.find(x=>x.id===FM.id);if(i){i.texto=FM.texto.trim();i.tipo=FM.tipo;i.proy=FM.proy;i.fecha=FM.fecha;i.todoDia=!!FM.todoDia;i.hora=FM.todoDia?"":(FM.hora||"09:00");i.fin=FM.todoDia?"":(FM.fin||"");i.rem=FM.rem;i.pri=FM.pri;i.notas=FM.notas;i.pasos=FM.pasos;}toast("Cambios guardados");}
      else{crearItems(FM);toast("Guardado: "+FM.texto.trim());}
      if(tab==="cal")calDia=FM.fecha,calMes=FM.fecha.slice(0,7);
      sheet=null;save();render();break;}
    case "fm-del":{const i=S.items.find(x=>x.id===FM.id);if(!i)break;if(!confirm(`¿Borrar "${i.texto}"?`))break;
      let ids=[i.id];
      if(i.serie&&S.items.some(x=>x.serie===i.serie&&x.id!==i.id&&x.fecha>i.fecha)&&confirm("¿Borrar también las veces que se repite después de esta?"))ids=S.items.filter(x=>x.serie===i.serie&&x.fecha>=i.fecha).map(x=>x.id);
      S.items=S.items.filter(x=>!ids.includes(x.id));sheet=null;save();render();break;}
    case "fm-ics":{const f=FM;icsEvento("evento",f.texto||"Evento",f.fecha||hoy(),f.hora,f.fin,f.todoDia,REM_ICS[f.rem]||"",f.rep==="No"?"":f.rep,f.notas);break;}
    // calendario
    case "cal-vista":calVista=v;render();break;
    case "cal-dia":calDia=v;render();break;
    case "cal-mes":{const [y,m]=calMes.split("-").map(Number);const d=new Date(y,m-1+(+v),1);calMes=d.getFullYear()+"-"+pad(d.getMonth()+1);render();break;}
    case "cal-sem":calDia=addDays(calDia,+v);calMes=calDia.slice(0,7);render();break;
    case "cal-hoy":calMes=hoy().slice(0,7);calDia=hoy();render();break;
    case "cal-filtro":if(!v)hid={};else hid[v]=!hid[v];render();break;
    // pagos
    case "pagos-tab":pagosTab=v;render();break;
    case "ahorro":agregarMov({tipo:"ahorro",cat:"Fondo",metodo:"",monto:num(v),nota:"",fecha:hoy()});save();render();toast("Ahorro anotado: "+fmt(v));break;
    case "deu-edit":editDeuda=id;render();break;
    case "deu-cancel":editDeuda=null;render();break;
    case "deu-del":{const d=D();if(d&&confirm(`¿Eliminar la deuda con ${d.a}? Los pagos que ya hiciste quedan en tu historial.`)){S.fin.movs.forEach(m=>{if(m.deudaId===id)delete m.deudaId;});S.fin.deudas=S.fin.deudas.filter(x=>x.id!==id);editDeuda=null;save();render();}break;}
    case "deu-cal":{const d=D();if(d)icsEvento("deuda-"+d.a,`Pagar ${fmt(resta(d))} a ${d.a}`,d.vence,"09:00","",false,"-P1D","","");break;}
    case "pagar":{const d=D();if(d){PG={id:id,monto:String(resta(d)),met:"Yape"};sheet="pagar";renderSheet();}break;}
    case "pg-monto":PG.monto=v;renderSheet();break;
    case "pg-met":PG.met=v;renderSheet();break;
    case "pg-ok":{const d=S.fin.deudas.find(x=>x.id===PG.id);if(!d)break;const m=Math.min(num(PG.monto),resta(d));if(m<=0){toast("Pon un monto mayor a 0");break;}
      const aid=uid(),mv=agregarMov({tipo:"pago",cat:"Deuda: "+d.a,metodo:PG.met,monto:m,nota:"",fecha:hoy(),deudaId:d.id,abonoId:aid});
      d.abonos.push({id:aid,monto:m,fecha:hoy(),metodo:PG.met,movId:mv.id});sheet=null;save();render();toast(resta(d)<=0?`¡Deuda con ${d.a} pagada!`:`Registrado: ${fmt(m)} a ${d.a} con ${PG.met}`);break;}
    case "abono-del":{const d=S.fin.deudas.find(x=>x.id===b.dataset.deuda);if(!d)break;const ab=d.abonos.find(x=>x.id===id);if(!ab)break;
      if(!confirm(`¿Deshacer el pago de ${fmt(ab.monto)}?`))break;
      if(ab.movId&&S.fin.movs.some(m=>m.id===ab.movId))borrarMov(ab.movId);else d.abonos=d.abonos.filter(x=>x.id!==id);
      save();render();break;}
    case "cobrar":CB={id:id,met:"Yape"};sheet="cobrar";renderSheet();break;
    case "cb-met":CB.met=v;renderSheet();break;
    case "cb-ok":{const c=S.fin.cobros.find(x=>x.id===CB.id);if(!c)break;
      const mv=agregarMov({tipo:"ingreso",cat:"Cobro: "+c.nombre,metodo:CB.met,monto:num(c.monto),nota:(PN[c.proy]||PN.per).n,fecha:hoy(),cobroId:c.id});
      c.cobrado=true;c.cobradoEl=hoy();c.movId=mv.id;sheet=null;save();render();toast("Cobrado: "+fmt(c.monto));break;}
    case "cobro-undo":{const c=S.fin.cobros.find(x=>x.id===id);if(c){if(c.movId&&S.fin.movs.some(m=>m.id===c.movId))borrarMov(c.movId);else c.cobrado=false;save();render();}break;}
    case "cobro-del":{const c=S.fin.cobros.find(x=>x.id===id);if(c&&confirm(`¿Quitar el cobro "${c.nombre}"?`)){if(c.movId)borrarMov(c.movId);S.fin.cobros=S.fin.cobros.filter(x=>x.id!==id);save();render();}break;}
    case "mov-del":if(confirm("¿Borrar este movimiento?")){borrarMov(id);save();render();}break;
    // hábitos
    case "hab-tog":{const h=S.habitos.find(x=>x.id===id);if(!h||h.auto)break;const d=b.dataset.dia;if(h.dias[d])delete h.dias[d];else h.dias[d]=true;save();render();break;}
    case "hab-mes":{const [y,m]=habMes.split("-").map(Number);const d=new Date(y,m-1+(+v),1);const k=d.getFullYear()+"-"+pad(d.getMonth()+1);if(k<=hoy().slice(0,7)){habMes=k;render();}break;}
    case "hab-on":{const h=S.habitos.find(x=>x.id===id);if(h){h.activo=true;save();render();}break;}
    case "hab-del":if(confirm("¿Borrar este hábito y su historial?")){S.habitos=S.habitos.filter(x=>x.id!==id);save();render();}break;
    // notas
    case "nota-del":if(confirm("¿Borrar esta nota?")){S.notas=S.notas.filter(n=>n.id!==id);save();render();}break;
    case "nota-pin":{const n=S.notas.find(x=>x.id===id);if(n){n.fijada=!n.fijada;save();render();}break;}
    case "nota-tarea":{const n=S.notas.find(x=>x.id===id);if(n){S.items.push({id:uid(),texto:n.texto.split("\n")[0].slice(0,120),tipo:"Tarea",proy:proyDe(n.texto),fecha:hoy(),todoDia:true,hora:"",fin:"",hecha:false,hechaEl:null,rep:"No",rem:"Sin aviso",pri:"Normal",notas:n.texto.split("\n").length>1?n.texto:"",pasos:[],serie:null,creada:Date.now()});save();toast("Pasada a tareas de hoy");}break;}
    case "nota-copy":{const n=S.notas.find(x=>x.id===id);if(n){try{await navigator.clipboard.writeText(n.texto);toast("Copiada");}catch(err){toast("No se pudo copiar");}}break;}
    // ajustes
    case "badge":try{const p=await Notification.requestPermission();if(p==="granted")updateBadge();render();}catch(err){toast("Tu iPhone no permitió el contador");}break;
    case "export":exportar();break;
    case "import":$("fileImport").click();break;
    case "pre-v3":{const raw=localStorage.getItem(KEY+"-pre-v3");if(raw&&confirm("Esto reemplaza lo que tienes ahora por los datos que tenías antes de la v3. ¿Seguir?")){try{S=migrar(JSON.parse(raw));save();ajustes=false;render();toast("Datos de la v2 cargados");}catch(err){toast("No se pudo leer esa copia");}}break;}
  }
});
// Lo que escribes en las hojas se guarda sin recargarlas (así no pierdes el cursor)
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.fm&&FM){FM[el.dataset.fm]=el.value;}
  if(el.dataset.pg&&PG){PG.monto=el.value;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.fm==="pasoIn"){e.preventDefault();if(FM.pasoIn.trim()){FM.pasos.push({t:FM.pasoIn.trim(),ok:false});FM.pasoIn="";renderSheet();const g=document.querySelector('[data-fm="pasoIn"]');g&&g.focus();}}
  if(e.key==="Escape"&&sheet){sheet=null;renderSheet();}
});
document.addEventListener("submit",e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==="rapida"){const tx=f.texto.value.trim();if(!tx)return;
    S.items.push({id:uid(),texto:tx,tipo:"Tarea",proy:proyDe(tx),fecha:hoy(),todoDia:true,hora:"",fin:"",hecha:false,hechaEl:null,rep:"No",rem:"Sin aviso",pri:"Normal",notas:"",pasos:[],serie:null,creada:Date.now()});
    save();render();const g=document.querySelector('[data-form="rapida"] input');g&&g.focus();}
  if(k==="ahorro"){const v=num(f.monto.value);if(v<=0){toast("Pon un monto mayor a 0");return;}agregarMov({tipo:"ahorro",cat:"Fondo",metodo:"",monto:v,nota:"",fecha:hoy()});save();render();toast("Ahorro anotado: "+fmt(v));}
  if(k==="deuda"){S.fin.deudas.push({id:uid(),a:f.a.value.trim(),monto:num(f.monto.value),vence:f.vence.value,nota:f.nota.value.trim(),abonos:[]});save();render();toast("Deuda guardada");}
  if(k==="deuda-edit"){const d=S.fin.deudas.find(x=>x.id===f.dataset.id);if(d){d.a=f.a.value.trim();d.monto=num(f.monto.value);d.vence=f.vence.value;d.nota=f.nota.value.trim();
    S.fin.movs.forEach(m=>{if(m.deudaId===d.id)m.cat="Deuda: "+d.a;});}editDeuda=null;save();render();toast("Deuda actualizada");}
  if(k==="cobro"){const v=num(f.monto.value);if(v<=0){toast("Pon un monto mayor a 0");return;}S.fin.cobros.push({id:uid(),nombre:f.nombre.value.trim(),proy:f.proy.value,monto:v,fecha:f.fecha.value||"",cobrado:false,cobradoEl:null,movId:null});save();render();toast("Cobro guardado");}
  if(k==="habito"){S.habitos.push({id:uid(),nombre:f.nombre.value.trim(),dias:{},auto:false,activo:true});save();render();}
  if(k==="nota"){S.notas.push({id:uid(),texto:f.texto.value.trim(),ts:Date.now(),fijada:false});save();render();toast("Nota guardada");}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="mes-sel"){mesSel=el.value;render();}
});

/* ================= Backup ================= */
async function exportar(){
  const json=JSON.stringify(S,null,1),name=`libreta-backup-${hoy()}.json`;
  try{const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Copia de Libreta"});return;}}catch(err){if(err&&err.name==="AbortError")return;}
  const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
$("fileImport").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  try{const d=JSON.parse(await file.text());if(!d||!d.version||!d.fin)throw 0;
    if(confirm("Esto reemplaza todo lo que tienes ahora con la copia. ¿Seguir?")){S=migrar(d);save();ajustes=false;render();toast("Copia restaurada");}}
  catch(err){toast("Ese archivo no es una copia de Libreta");}
});

/* ================= Arranque ================= */
save(); // guarda ya los datos migrados
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
let ultimoDia=hoy();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&hoy()!==ultimoDia){ultimoDia=hoy();calDia=hoy();calMes=hoy().slice(0,7);habMes=hoy().slice(0,7);save();render();}});
</script>
